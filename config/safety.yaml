# config/safety.yaml
# 软件安全联锁与故障监控参数（设计 §7.2 / §8）。
#
# !! 安全声明 !!
# 1) 本文件所有超时/阈值均为**保守占位值**，未在任何真实 AUBO S3 上标定。
# 2) 本文件**不含任何凭据**：没有账号、密码、Token、密钥、控制柜地址、真实 IP。
#    设备身份白名单字段**刻意留空**占位，见下方 device_identity 段。
# 3) 留空语义（安全默认）：whitelist 中 identity 未核实或序列号为空时，
#    AuboBridge.identity_check() 一律返回不通过，从而**拒绝建立运动通路**。
#    即“未配置 = 拒绝”，绝不退化为“未配置 = 放行”。

mtc_safety:
  ros__parameters:

    # ---- 设备身份白名单（留空占位） ------------------------------------
    device_identity:
      # 允许接入的控制柜型号白名单。留空 = 不信任任何设备（安全默认拒绝）。
      controller_model_whitelist: []      # 占位：留空 -> 拒绝建立运动通路
      # 允许接入的设备序列号白名单。留空 = 不信任任何设备（安全默认拒绝）。
      serial_number_whitelist: []         # 占位：留空 -> 拒绝建立运动通路
      # 身份是否已由现场人工核实。false = 一律拒绝（不得预先置 true）。
      identity_verified: false            # 占位：留空 -> 拒绝建立运动通路
      # 期望的 SDK / ARCS 版本（仅用于比对记录，留空表示不校验版本）。
      arcs_version: ""                    # 占位
      sdk_version: ""                     # 占位
      interface_version: ""               # 占位
      # 运动通路总开关。留空/未核实身份时即使置 true 也必须被拒绝。
      allow_motion_after_identity_check: false   # 占位：默认不放行

    # ---- 通信与状态新鲜度超时（秒，全部 > 0） -------------------------
    robot_state_timeout_sec: 0.5          # 待实物标定（占位值）
    tool_state_timeout_sec: 1.0           # 待实物标定（占位值）
    stop_confirm_timeout_sec: 2.0         # 待实物标定（占位值）
    feedback_freshness_limit_s: 0.5       # 待实物标定（占位值）
    state_ttl_sec: 0.5                    # 待实物标定（占位值）

    # ---- 控制器模式与真机/仿真判别 -------------------------------------
    # 控制器模式白名单。留空 = 不限制模式（但仍受 READY + 状态新鲜约束）。
    expected_controller_modes: []         # 占位：留空表示不额外限制
    # 本次运行是否期望仿真模式。null 表示不校验（真机部署必须显式设为 false）。
    expect_simulation: null               # 占位：待现场配置

    # ---- 联锁阈值（禁止放宽） ------------------------------------------
    # 未验证挂载 -> 禁止运输；落座未确认 -> 禁止 V2 解锁脉冲；
    # 解锁/脱离不确定 -> 禁止撤离；运动在途 -> 拒绝第二个 Goal。
    require_attach_verified_before_transport: true   # 禁止改为 false
    require_seat_verified_before_unlock: true        # 禁止改为 false
    require_release_verified_before_withdraw: true   # 禁止改为 false
    reject_second_motion_goal: true                  # 禁止改为 false
    forbid_auto_resend_after_timeout: true           # 禁止改为 false
    # 取消 / 断线后必须确认停稳，才允许返回成功或启动下一目标。
    require_stop_confirmed_after_cancel: true        # 禁止改为 false
    # FAULT 只能由人工 clear_by_human(note) 解除；自动路径永远失败。
    fault_latch_human_clear_only: true               # 禁止改为 false

    # ---- 载荷与重试 ----------------------------------------------------
    # 载荷状态未知时禁止进入下一任务项 / 无条件 Home。
    payload_unknown_blocks_next_item: true
    # 自动重试白名单（仅“确认无载荷且运动状态已知”的可恢复错误）。
    recovery_max_attempts: 1              # 待实物标定
    recoverable_error_codes: [110, 120, 200]   # TARGET_NOT_FOUND / POSE_STALE / PLANNING_FAILED

    # ---- 软件停止语义声明（文档性字段） --------------------------------
    # 软件停止请求**不替代**实体急停；送达 != 停稳。
    software_stop_is_not_estop: true
    topic_binding: "/mtc/motion/request_stop"   # 见 INTERFACE_CHANGELOG §4.1 显式偏差
